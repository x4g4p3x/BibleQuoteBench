name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust quality components
        run: rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --check
      - name: Check all targets
        run: cargo check --locked --all-targets --all-features
      - name: Run strict Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Validate rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Run all tests
        run: cargo test --locked --all-targets --all-features

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install coverage support
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.9.0 --locked
      - name: Enforce line coverage
        run: cargo llvm-cov --locked --all-targets --all-features --fail-under-lines 80 --lcov --output-path lcov.info
